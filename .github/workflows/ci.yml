name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只读权限：CI 不需要写仓库，最小权限能限制被攻破的 action 能造成的破坏
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 跑 README 里给新贡献者的那条命令：生成迁移、建表、灌种子数据。
      # 用它而不是拆开的三条，是为了让 CI 顺带验证 `pnpm setup` 本身没坏——
      # 新人照文档执行的第一条命令失灵，是最劝退的一种故障。
      #
      # 这一步是构建的前提：generateStaticParams 会读本地 D1 取商品与工况列表，
      # 没有建表构建就会以 "no such table" 失败。
      - run: pnpm setup

      - run: pnpm typecheck

      - run: pnpm lint

      # 测试跑在真实 workerd 运行时里，不是 Node mock
      - run: pnpm test

      - run: pnpm build
