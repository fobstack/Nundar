name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never writes to the repository, and least privilege caps the
# damage a compromised action could do
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Runs the exact command the README gives a new contributor: generate
      # migrations, create the tables, load the seed data. Using it instead of
      # the three underlying commands means CI also proves `pnpm setup` still
      # works — the first command someone runs from the docs failing is the most
      # discouraging kind of breakage.
      #
      # The build depends on this: generateStaticParams reads the local D1 for
      # the product and use-case lists, so without the tables it fails with
      # "no such table".
      - run: pnpm setup

      - run: pnpm typecheck

      - run: pnpm lint

      # Tests run inside the real workerd runtime, not a Node mock
      - run: pnpm test

      - run: pnpm build
