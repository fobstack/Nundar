name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never writes to the repository, and least privilege caps the
# damage a compromised action could do
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm, not pnpm: Mallok's CLI installs and upgrades with npm only, and
      # refuses a project that carries another manager's lockfile
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # The project checks run in Node; the shop plugin's and the theme's tests
      # run inside the real workerd runtime, not a Node mock
      - run: npm test

      # Stages the admin and theme assets, then a production build
      - run: npm run build

      # A real request to a real Worker: it boots, migrates and renders
      - run: npm run smoke

      # The whole shop on a real Worker: settings, content published with the
      # Mallok CLI, the seed, pages in two languages, the cart
      - run: npm run smoke:shop
